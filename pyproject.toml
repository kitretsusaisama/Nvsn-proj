[project]
name = "nvsn-framework"
version = "0.1.0"
description = "N-vs-N Agent Intelligence Framework"
authors = [
    { name = "Jules", email = "jules@example.com" }
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=23.0",
    "httpx>=0.24",
    "numpy>=1.24",
    "google-generativeai>=0.3.0",
    "torch>=2.0.0",
    "networkx>=3.0",
    "scikit-learn>=1.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "tenacity>=8.0.0",
    "rich>=13.0.0",
    "pillow>=10.0.0",
    "markdown-it-py>=3.0.0",
]
requires-python = ">=3.9"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nvsn"]

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py39"
select = ["E", "F", "I", "UP", "N", "B", "A", "C4", "PT", "RUF"]
ignore = []

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = [
    "tests",
]
